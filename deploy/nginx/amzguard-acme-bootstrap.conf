server {
    listen 80;
    listen [::]:80;
    server_name 123.58.218.45;
    server_tokens off;

    access_log /var/log/nginx/amzguard-acme.access.log combined;
    error_log /var/log/nginx/amzguard-acme.error.log warn;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type text/plain;
    }

    location / {
        return 404;
    }
}
