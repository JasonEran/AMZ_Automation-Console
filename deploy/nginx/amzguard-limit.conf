# Installed into /etc/nginx/conf.d (http context).
# Loading or refreshing the login page must stay available. Only credential
# submissions consume the edge rate-limit; the Node service independently
# locks an IP after repeated invalid credentials as a second layer.
map $request_method $amzguard_login_limit_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $amzguard_login_limit_key zone=amzguard_login:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=amzguard_product_upload:10m rate=2r/m;
limit_conn_zone $binary_remote_addr zone=amzguard_product_upload_conn:10m;

# Do not put query strings (which may contain temporary auth parameters) into
# the dedicated application access log.
log_format amzguard_safe '$remote_addr [$time_local] "$request_method $uri $server_protocol" '
                         '$status $body_bytes_sent';
