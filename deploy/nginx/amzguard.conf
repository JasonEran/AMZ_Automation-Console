server {
    listen 80;
    listen [::]:80;
    server_name 123.58.218.45;
    server_tokens off;

    access_log /var/log/nginx/amzguard.access.log amzguard_safe;
    # Nginx error-log format is not customizable and lower levels may include
    # the raw request URI. Keep only critical transport/process failures.
    error_log /var/log/nginx/amzguard.error.log crit;

    location ^~ /.well-known/acme-challenge/ { root /var/www/acme; }
    # Deliberately discard query strings while redirecting. Authentication and
    # temporary SSO parameters must never be copied into redirects or access logs.
    location / { return 308 https://123.58.218.45$uri; }
}

server {
    listen 80;
    listen [::]:80;
    server_name amzcheck.pc51.com;
    server_tokens off;

    access_log /var/log/nginx/amzguard.access.log amzguard_safe;
    error_log /var/log/nginx/amzguard.error.log crit;

    # Discard query strings on the HTTPS redirect so credentials and temporary
    # authorization parameters cannot be copied into logs or Location headers.
    location / { return 308 https://amzcheck.pc51.com$uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 123.58.218.45;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/123.58.218.45/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/123.58.218.45/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AMZGuardTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    access_log /var/log/nginx/amzguard.access.log amzguard_safe;
    error_log /var/log/nginx/amzguard.error.log crit;
    # Node enforces a 20 MiB exact Content-Length. Keep a small protocol margin
    # while still rejecting unexpectedly large bodies at the edge.
    client_max_body_size 21m;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;

    location = /login {
        limit_req zone=amzguard_login burst=5 nodelay;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Production is intentionally single-host: collectors write directly to
    # /opt/amzguard/out. Keep the token-protected ingest API unreachable from
    # the Internet unless a future, allow-listed remote collector is approved.
    location = /api/ingest { return 404; }

    location = /api/product-uploads/stage {
        limit_req zone=amzguard_product_upload burst=2 nodelay;
        limit_conn amzguard_product_upload_conn 1;
        client_body_timeout 60s;
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        proxy_pass http://127.0.0.1:4173;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
    }
}

